services:
  - type: web
    name: reprieve-backend
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: ENV_NAME
        value: production
      - key: FALKORDB_HOST
        value: r-6jissuruar.instance-3mq6bg39x.hc-7up0crkyn.ap-south-1.aws.f2e0a955bb84.cloud
      - key: FALKORDB_PORT
        value: 51446
      - key: FALKORDB_USERNAME
        value: falkordb
      - key: FALKORDB_PASSWORD
        sync: false
      - key: FALKORDB_TLS
        value: false
      - key: GRAPH_PREFIX
        value: dev_
      - key: WEB_ORIGIN
        value: "*"
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: INTERNAL_TICK_SECRET
        generateValue: true
