<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="invarix-grad-primary" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6353E8" />
      <stop offset="50%" stopColor="#8B5CF6" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <linearGradient id="invarix-grad-secondary" x1="56" y1="8" x2="8" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#6353E8" />
      <stop offset="100%" stopColor="#4F46E5" />
    </linearGradient>
    <linearGradient id="invarix-glow" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6353E8" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#06B6D4" stopOpacity="0" />
    </linearGradient>
    <filter id="invarix-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Central Nexus -->
  <circle cx="32" cy="32" r="18" fill="url(#invarix-glow)" filter="url(#invarix-blur)" />

  <!-- Outer Invariant Hexagonal Shield Boundary -->
  <polygon 
    points="32,6 54,18 54,46 32,58 10,46 10,18" 
    stroke="url(#invarix-grad-primary)" 
    stroke-width="2.5" 
    stroke-linejoin="round"
    fill="#0C0D14" 
    fill-opacity="0.85"
  />

  <!-- Upper Invariant Converging Vector (Causal Ingress) -->
  <path 
    d="M 19 19 L 32 30 L 45 19" 
    stroke="url(#invarix-grad-secondary)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Lower Invariant Converging Vector (Circuit Breaker Intercept) -->
  <path 
    d="M 19 45 L 32 34 L 45 45" 
    stroke="url(#invarix-grad-primary)" 
    stroke-width="3" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Interlocking Diagonal Struts forming the Invariant "X" -->
  <line x1="20" y1="20" x2="44" y2="44" stroke="url(#invarix-grad-primary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" />
  <line x1="44" y1="20" x2="20" y2="44" stroke="url(#invarix-grad-secondary)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4" />

  <!-- Central Diamond Invariance Nexus Node -->
  <polygon points="32,27 37,32 32,37 27,32" fill="#FFFFFF" />
  <circle cx="32" cy="32" r="2" fill="#6353E8" />

  <!-- Topological Graph Junction Vertices -->
  <circle cx="32" cy="6" r="2.5" fill="#06B6D4" />
  <circle cx="54" cy="18" r="2.5" fill="#8B5CF6" />
  <circle cx="54" cy="46" r="2.5" fill="#6353E8" />
  <circle cx="32" cy="58" r="2.5" fill="#06B6D4" />
  <circle cx="10" cy="46" r="2.5" fill="#6353E8" />
  <circle cx="10" cy="18" r="2.5" fill="#8B5CF6" />
</svg>
