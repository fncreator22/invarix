[project]
name = "reprieve-backend"
version = "0.1.0"
description = "Reprieve: Graph-Native Risk Reasoning Engine powered by FalkorDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "falkordb>=1.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.3",
    "pyyaml>=6.0.2",
    "python-ulid>=3.0.0",
    "cachetools>=5.5.0",
    "openai>=1.50.0",
    "pyjwt[crypto]>=2.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
